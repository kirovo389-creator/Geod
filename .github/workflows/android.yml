name: Build AETHER Android (libGDX)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug
      - name: Verify APK
        run: |
          APK="android/build/outputs/apk/debug/android-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Android-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="libgdx-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --title "AETHER Android ${GITHUB_RUN_NUMBER}" --notes "License-free libGDX Android APK. Commit ${GITHUB_SHA}."
