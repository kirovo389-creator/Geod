name: Build AETHER Android (Unity)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add UNITY_LICENSE to repository Actions secrets to build Unity."
            exit 1
          fi
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.0.40f1
          targetPlatform: Android
          androidAppBundle: false
      - name: Verify APK and print size
        run: |
          APK="$(find . -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          ls -lh "$APK"
          stat -c 'APK size: %s bytes' "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="unity-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --title "AETHER Unity Android ${GITHUB_RUN_NUMBER}" --notes "Unity Android APK. Commit ${GITHUB_SHA}."
