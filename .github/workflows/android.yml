name: Build AETHER Android (Godot 4.5.2)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot and Android export templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget libfontconfig1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpacked
          cp -a /tmp/godot-template-unpacked/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Configure Godot Android paths and debug keystore
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and check scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          godot --headless --path . --quit-after 10 --verbose 2>&1 | tee /tmp/godot-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' /tmp/godot-import.log /tmp/godot-smoke.log; then
            echo "Godot script smoke test failed."
            exit 1
          fi

      - name: Export Android APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" "$PWD/build/Aether.apk"
          test -s build/Aether.apk
          unzip -t build/Aether.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/Aether.apk
          ls -lh build/Aether.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Android-APK
          path: build/Aether.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="godot-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/Aether.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AETHER Godot Android ${GITHUB_RUN_NUMBER}" \
            --notes "Godot ${GODOT_VERSION} Compatibility renderer. Commit ${GITHUB_SHA}."
