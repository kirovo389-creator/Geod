name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android APK
        uses: barichello/godot-ci@4.4.1
        with:
          name: Aether
          preset: Android
          project: .
          output: build/Aether.apk

      - name: Verify APK
        run: test -s build/Aether.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/Aether.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AETHER Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Автоматическая Android-сборка из коммита ${GITHUB_SHA}. Debug APK для тестирования."
