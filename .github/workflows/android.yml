name: Build How to Suck Android (Godot 4.5.2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          SDK_TOOLS_ROOT="$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$SDK_TOOLS_ROOT/latest" ]; then
            TOOLS_VERSION="$(find "$SDK_TOOLS_ROOT" -mindepth 1 -maxdepth 1 -type d ! -name latest -printf '%f\n' | sort -V | tail -n 1)"
            test -n "$TOOLS_VERSION"
            ln -s "$TOOLS_VERSION" "$SDK_TOOLS_ROOT/latest"
          fi
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/cmdline-tools/latest"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -x "$JAVA_HOME/bin/java"
          ls -l "$SDK_TOOLS_ROOT"

      - name: Install Godot and matching Android templates
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget libfontconfig1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-template-unpacked
          cp -a /tmp/godot-template-unpacked/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Configure Godot Android paths and debug keystore
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Check project structure
        run: python3 tests/verify_project.py

      - name: Import project and run state tests
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          godot --headless --path . --quit-after 100 res://tests/game_state_test.tscn 2>&1 | tee /tmp/godot-tests.log
          grep -q "GAME_STATE_TESTS_PASSED" /tmp/godot-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|shader compilation failed|error parsing shader|GAME_STATE_TESTS_FAILED' /tmp/godot-import.log /tmp/godot-tests.log; then
            echo "Godot import or game-state tests failed."
            exit 1
          fi

      - name: Load the main scene and smoke-test scripts
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 --verbose 2>&1 | tee /tmp/godot-smoke.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|shader compilation failed|error parsing shader' /tmp/godot-smoke.log; then
            echo "Main scene smoke test failed."
            exit 1
          fi

      - name: Export Android APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" "$PWD/build/HowToSuck.apk"
          test -s build/HowToSuck.apk
          unzip -t build/HowToSuck.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/HowToSuck.apk
          ls -lh build/HowToSuck.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: how-to-suck-android-debug
          path: build/HowToSuck.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: how-to-suck-build-logs
          path: /tmp/godot-*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: how-to-suck-android-debug
          path: build

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="how-to-suck-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/HowToSuck.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "How to Suck Android ${GITHUB_RUN_NUMBER}" \
            --notes "Godot ${GODOT_VERSION}, Compatibility renderer, debug build. Commit ${GITHUB_SHA}. Not a Play Store release."
