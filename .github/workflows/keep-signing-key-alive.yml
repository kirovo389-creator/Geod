name: Keep Frilance signing key cache alive

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-signing-key:
    name: Verify persistent Android signing key
    runs-on: ubuntu-latest
    steps:
      - name: Restore the existing signing key cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          # Do not change this cache key: changing it rotates the APK signature.
          key: frilance-debug-signing-key-v1

      - name: Verify key exists and is readable
        run: |
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::The persistent signing-key cache is missing. Do not generate a replacement key."
            exit 1
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
