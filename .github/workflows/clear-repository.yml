name: One-time repository cleanup
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clear-repository.yml"
permissions:
  contents: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove all tracked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files -z | xargs -0 -r git rm --
          git commit -m "chore: clear repository contents"
          git push origin HEAD:main
