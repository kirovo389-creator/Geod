name: Build Telegram Read-Only ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean ZIP with empty local session placeholder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/telegram-readonly/server package/telegram-readonly/skills/telegram-readonly
          cp plugin.json mcp.json requirements.txt README_RU.md package/telegram-readonly/
          cp server/main.py package/telegram-readonly/server/
          cp skills/telegram-readonly/SKILL.md package/telegram-readonly/skills/telegram-readonly/
          : > package/telegram-readonly/session.txt
          cat > package/telegram-readonly/.gitignore <<'EOF'
          .env
          *.session
          *.session-journal
          __pycache__/
          .venv/
          EOF
          python -m compileall -q package/telegram-readonly/server/main.py
          python -m json.tool package/telegram-readonly/plugin.json >/dev/null
          python -m json.tool package/telegram-readonly/mcp.json >/dev/null
          cd package
          zip -r telegram-readonly.zip telegram-readonly

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-readonly-zip
          path: package/telegram-readonly.zip
          if-no-files-found: error
          retention-days: 7
