name: Reset Geod and install Telegram Read-Only plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-and-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Geod
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Replace repository contents with Telegram plugin source
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly reset tracked project contents; keep the active workflow.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p server skills/telegram-readonly .github/workflows

          cat > plugin.json <<'EOF'
          {
            "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
            "name": "telegram-readonly",
            "version": "0.1.1",
            "description": "Read-only Telegram chat and message search using a local Telethon session.",
            "author": {"name": "Private plugin"},
            "extensions": {"com.openai": {"interface": {
              "displayName": "Telegram Read-Only",
              "shortDescription": "Read Telegram chats",
              "longDescription": "Read-only connector for Telegram dialogs and message history. Requires a compatible local MCP runtime.",
              "developerName": "Private plugin",
              "category": "Productivity",
              "capabilities": ["Chat"],
              "defaultPrompt": "List my Telegram chats and search message history in read-only mode."
            }}}
          }
          EOF

          cat > mcp.json <<'EOF'
          {
            "$schema": "https://agent-plugins.org/schemas/1.0.0/mcp.schema.json",
            "mcpServers": {
              "telegram-readonly": {
                "type": "stdio",
                "command": "python",
                "args": ["${PLUGIN_ROOT}/server/main.py"],
                "cwd": "${PLUGIN_ROOT}"
              }
            }
          }
          EOF

          cat > requirements.txt <<'EOF'
          telethon>=1.36.0
          mcp>=1.2.0
          EOF

          cat > server/main.py <<'PYEOF'
          import os
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from mcp.server.fastmcp import FastMCP

          API_ID = os.getenv("TELEGRAM_API_ID", "").strip()
          API_HASH = os.getenv("TELEGRAM_API_HASH", "").strip()
          SESSION_TXT = os.getenv("TELEGRAM_SESSION_TXT", "").strip()
          SESSION_PATH = os.getenv("TELEGRAM_SESSION_PATH", str(Path.home() / ".telegram-readonly" / "telegram.session"))

          if not API_ID.isdigit() or not API_HASH:
              raise SystemExit("Set TELEGRAM_API_ID and TELEGRAM_API_HASH in the local environment.")

          if SESSION_TXT:
              p = Path(SESSION_TXT).expanduser()
              if not p.is_file():
                  raise SystemExit("TELEGRAM_SESSION_TXT must point to a local text file.")
              value = p.read_text(encoding="utf-8").strip()
              if not value:
                  raise SystemExit("The session text file is empty.")
              session = StringSession(value)
          else:
              session = SESSION_PATH

          client = TelegramClient(session, int(API_ID), API_HASH)
          mcp = FastMCP("Telegram Read-Only")

          async def ensure_client():
              await client.connect()
              if not await client.is_user_authorized():
                  raise RuntimeError("Telegram session is not authorized. Authenticate locally; never upload the session to chat.")

          @mcp.tool()
          async def list_dialogs(limit: int = 100) -> list[dict]:
              """List dialogs, groups, and channels visible to the authorized account."""
              await ensure_client()
              out = []
              async for d in client.iter_dialogs(limit=max(1, min(int(limit), 200))):
                  e = d.entity
                  out.append({"name": d.name or "", "id": int(d.id), "username": getattr(e, "username", None),
                              "entity_type": e.__class__.__name__, "unread_count": int(getattr(d, "unread_count", 0))})
              return out

          @mcp.tool()
          async def recent_messages(chat_id: int, limit: int = 30) -> list[dict]:
              """Read recent messages from a Telegram dialog by ID."""
              await ensure_client()
              out = []
              async for m in client.iter_messages(int(chat_id), limit=max(1, min(int(limit), 100))):
                  sender = await m.get_sender()
                  out.append({"id": int(m.id), "date": m.date.isoformat() if m.date else None,
                              "sender_id": int(sender.id) if sender and getattr(sender, "id", None) else None,
                              "text": m.message or ""})
              return list(reversed(out))

          @mcp.tool()
          async def search_messages(query: str, limit: int = 30, chat_id: int | None = None) -> list[dict]:
              """Search accessible message history; optionally restrict to one chat ID."""
              await ensure_client()
              query = query.strip()
              if not query:
                  return []
              limit = max(1, min(int(limit), 100))
              out = []
              if chat_id is not None:
                  async for m in client.iter_messages(int(chat_id), search=query, limit=limit):
                      out.append({"chat_id": int(chat_id), "message_id": int(m.id),
                                  "date": m.date.isoformat() if m.date else None, "text": m.message or ""})
                  return out
              async for d in client.iter_dialogs(limit=200):
                  async for m in client.iter_messages(d.entity, search=query, limit=5):
                      out.append({"chat_id": int(d.id), "chat_name": d.name, "message_id": int(m.id),
                                  "date": m.date.isoformat() if m.date else None, "text": m.message or ""})
                      if len(out) >= limit:
                          return out
              return out

          if __name__ == "__main__":
              mcp.run()
          PYEOF

          cat > skills/telegram-readonly/SKILL.md <<'EOF'
          ---
          name: telegram-readonly
          description: List Telegram dialogs and read or search message history through a configured local connector.
          ---
          # Telegram Read-Only
          This connector only lists dialogs and reads/searches messages. It cannot send, edit, or delete messages. Configure TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_SESSION_TXT locally. The text file must contain a Telethon StringSession. Never commit or upload the session file or its contents.
          EOF

          cat > README_RU.md <<'EOF'
          # Telegram Read-Only

          Read-only MCP connector: список диалогов, чтение последних сообщений и поиск.

          ## Локальная настройка
          Установите зависимости из requirements.txt и задайте переменные окружения:
          - TELEGRAM_API_ID
          - TELEGRAM_API_HASH
          - TELEGRAM_SESSION_TXT — полный путь к локальному .txt, содержащему именно Telethon StringSession

          Альтернатива: TELEGRAM_SESSION_PATH указывает на обычную SQLite-сессию Telethon.

          **Не добавляйте файл сессии в репозиторий, GitHub Actions artifacts или ChatGPT.** Сессия даёт доступ к аккаунту. Если вы отзовёте её в Telegram, доступ исчезнет.

          GitHub Actions здесь только обновляет исходники и проверяет проект; это не постоянный сервер. Конфигурация MCP использует stdio и требует хоста, который может запускать локальный Python-процесс. Одного репозитория недостаточно, чтобы подключить Telegram к ChatGPT Android.
          EOF

          cat > .gitignore <<'EOF'
          .env
          *.session
          *.session-journal
          session.txt
          *.txt
          __pycache__/
          .venv/
          EOF

          python -m compileall -q server/main.py
          python -m json.tool plugin.json >/dev/null
          python -m json.tool mcp.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reset repository and install Telegram read-only plugin" || echo "No changes to commit"
          git push
