name: Build Fotik Android

on:
  push:
    branches:
      - fotik-safe-android
    paths:
      - "fotik-android/**"
      - ".github/workflows/fotik-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Run tests and build APK
        run: gradle --no-daemon -p fotik-android clean testDebugUnitTest assembleDebug

      - name: Verify APK
        run: |
          APK="fotik-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotik-debug-apk
          path: fotik-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fotik-debug-apk
          path: build

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NO: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="fotik-android-${RUN_NO}"
          gh release create "$TAG" build/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Фотик Android ${RUN_NO}" \
            --notes "Debug APK built from commit ${COMMIT_SHA}. The app records only with a visible camera preview and requires an explicit user action to share saved video."
