name: Build Frilance APK and publish release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frilance-android-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test and build native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: frilance-debug-signing-key-v1

      - name: Create signing key on first build
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Frilance Debug,O=Frilance,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Java trade tests and build APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Prepare release asset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Frilance.apk
          sha256sum release-assets/Frilance.apk | tee release-assets/SHA256SUMS.txt

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frilance-APK
          path: |
            release-assets/Frilance.apk
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frilance-v1.0.${{ github.run_number }}
          name: Frilance Android v1.0.${{ github.run_number }}
          body: |
            Frilance — native Java Android crypto-market simulator.

            - Starting balance: $5.00 virtual cash
            - Native Java interface; no HTML or WebView
            - Live public prices and native candlestick chart
            - Precise fractional positions and full sale proceeds
            - Separate market and portfolio tabs
            - Six-hour cooldown for large-drop notifications
            - No real-money trades, deposits, or rewards

            This APK is debug-signed for direct installation.
          files: |
            release-assets/Frilance.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
