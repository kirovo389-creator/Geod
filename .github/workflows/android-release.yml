name: Android Geode release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v0.1.2)"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .geode for ${{ matrix.target }}
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: given
          combine: true
          configure-args: -DCMAKE_PROJECT_INCLUDE=${{ github.workspace }}/.github/patch-geode-sdk.cmake

  package:
    name: Combine Android builds and publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine Android32 and Android64 packages
        id: geode
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Verify package contains both Android architectures
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find "${{ steps.geode.outputs.build-output }}" -maxdepth 1 -name '*.geode' -type f -print -quit)"
          test -n "$FILE"
          CONTENTS="$(unzip -Z1 "$FILE")"
          printf '%s\n' "$CONTENTS"
          printf '%s\n' "$CONTENTS" | grep -Fxq 'kirovo389.dualmind.android32.so'
          printf '%s\n' "$CONTENTS" | grep -Fxq 'kirovo389.dualmind.android64.so'

      - name: Publish release and attach .geode
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || 'v0.1.2') }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || 'v0.1.2') }}
          generate_release_notes: true
          files: ${{ steps.geode.outputs.build-output }}/*.geode
