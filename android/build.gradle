plugins { id 'com.android.application' }
android {
    namespace 'com.aether.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aether.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${rootProject.ext.gdxVersion}"
}
