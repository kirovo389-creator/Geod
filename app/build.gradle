plugins {
    id "com.android.application"
}

android {
    namespace "com.frilance.game"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.frilance.game"
        minSdk 24
        targetSdk 34
        def releaseNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        // Reserve a higher range so upgrades replace older local/debug builds too.
        versionCode (1000 + releaseNumber)
        versionName "1.0." + releaseNumber
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    testImplementation "junit:junit:4.13.2"
}
